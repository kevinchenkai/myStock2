# myStock2 配置模板
# 复制为 config.yaml 并填入真实值；config.yaml 已加入 .gitignore，请勿提交。
# 真实的 universe / 协议 / 费用档案放 config/local/（同样被忽略）；本仓库只含模板与合成值。

# 富途 OpenD 本地网关（M2a 起使用）
futu:
  host: 127.0.0.1
  port: 11111
  # 交易密码只通过环境变量 MYSTOCK2_FUTU_TRADE_PWD 注入；此处出现非空 trade_pwd 会被拒绝。
  # 交易环境：REAL（实盘）/ SIMULATE（模拟）。历史成交仅支持 REAL。
  trd_env: REAL
  # 券商主体（futu.SecurityFirm 的名字，如 FUTUSECURITIES）：collect futu 必填，**须由负责人确认，不硬编码、不猜**（D10）。
  # security_firm: FUTUSECURITIES
  # 两次富途查询之间的最小间隔（秒；与 V1 共享接口额度，默认 3.2）
  # min_interval: 3.2

collect:
  markets:
    - HK
    - US

db:
  path: "data/mystock2.db"

# 标的名单（只用于给持仓标「核心/交易」角色）；默认 config/local/universe.yaml
# universe:
#   path: config/local/universe.yaml

# Web：只允许监听回环地址。开发期用 8889（V1 占用 8888）；切换日后改 8888（实施方案 §3.7）。
web:
  host: 127.0.0.1
  port: 8889

# 例行更新（python -m mystock2 update --phase hk|us|pre；见 docs/guides/daily-update_claude_20261005.md）。账户号只放本机 config.yaml。
update:
  account_id: main        # 账本里的账户占位名（须与导入时的 --account-id 一致）
  acc_id: 0               # 富途 acc_id（真实值只写本机 config.yaml）
  lookback_days: 10

# 对账既知残差基线（账本 − 券商，按币种；默认不设）。只对「偏离基线」报警，基线本身仍在对账输出里列出。
# reconcile:
#   known_cash_diffs:
#     USD: "-13.84"

# 复盘卡 AI 评价（调用本机 Codex，订阅登录，不走 API Key）。默认值如下；不需要时整段可省略。
# review:
#   model: gpt-6.1-sol
#   effort: medium
#   timeout_s: 900
#   codex_bin: /Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex   # 缺省自动查找
