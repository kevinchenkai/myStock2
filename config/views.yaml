# 视图启用/隐藏/顺序/默认参数（M3 视图框架读取；用户级自定义放这里，不进代码）。
#
# - 顺序＝本列表中的位置；未列出的视图（例如新增的视图文件夹）默认启用，按各自 view.yaml 的 order 排在其后。
# - enabled: false  视图停用（导航不显示，/api/v/<id> 返回 404）。
# - hidden: true    视图不在导航显示，但仍可通过 #/<id> 直接访问。
# - params          覆盖 view.yaml 里声明的参数默认值（未声明的参数会被忽略并在 /api/views 的 problems 中提示）。
views:
  - id: account_overview
    params:
      base_ccy: ""          # 留空＝不合计；可选 USD / HKD / CNY（选了才合计，且须有可用汇率）
  - id: holdings
  - id: trades
    params:
      limit: 2000          # 历史成交全部显示（最多 2000 笔，最新在前）
  - id: pnl
  - id: equity_trend
    params:
      max_points: 700
  - id: fx
    params:
      pair: USDCNY            # 负责人只关注美元—人民币
      days: 730               # 回看 2 年（库内自 2024-01-01 起）
  - id: tickets             # 操作单（密封语义：未揭示只显示「已密封」与计数）
  - id: scoreboard          # 记分牌（三类证据分区；不合成单一胜率结论）
  - id: forecast            # 预测效果（基线 vs LightGBM+CQR；rebuilt 样本不是前向证据；目标日未结束的预测价位密封）
    params:
      source: rebuilt
      window: 120
  - id: replay
    params:
      limit: 1000          # 全部成交的复盘卡（页面翻页显示）
  - id: data_status
  - id: stock               # 股票详情（弹窗里点代码打开；只读；各块独立，来源缺失只让该块「不可用」）
    hidden: true
