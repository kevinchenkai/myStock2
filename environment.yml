name: mk2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - PyYAML>=6.0
      - Flask>=3.0
      - yfinance==1.7.0   # 与 V1 同版本；公开接口，个人研究用途，不保证实时
      # dev
      - pytest>=8
      - hypothesis>=6
      - ruff>=0.5
      - numpy>=1.26      # LightGBM 候选线与测试
      - lightgbm>=4.0    # M8 候选线（原生 API，不依赖 scikit-learn；缺失时明确失败，不静默回退）
      # 后续里程碑按需加入：futu-api（M2a）、scikit-learn/lightgbm（M8），加入时锁定版本并说明理由
