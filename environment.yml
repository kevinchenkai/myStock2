name: mk
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - PyYAML>=6.0
      - Flask>=3.0
      - yfinance==1.7.0   # 与 V1 同版本；公开接口，个人研究用途，不保证实时
      # dev
      - pytest>=8
      - hypothesis>=6
      - ruff>=0.5
      - numpy>=1.26      # LightGBM 候选线与测试
      - lightgbm>=4.0    # M8 候选线（原生 API，不依赖 scikit-learn；缺失时明确失败，不静默回退）
      - futu-api==10.10.7008   # M2a 采集器（只读查询）；与负责人 V1 的 mk 环境同版本线
